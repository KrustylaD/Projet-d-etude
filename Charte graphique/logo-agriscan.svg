<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Squircle background -->
  <rect x="4" y="8" width="56" height="56" rx="20" ry="20" fill="#0A1B0E"/>

  <!-- Leaf symbol -->
  <g transform="translate(32, 36)" stroke="#D4FF50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Leaf shape -->
    <path d="M0 -18C-4 -14 -8 -10 -8 -6C-8 -2 -4.5 1 0 1C4.5 1 8 -2 8 -6C8 -10 4 -14 0 -18Z"/>
    <!-- Center stem -->
    <line x1="0" y1="-18" x2="0" y2="1"/>
    <!-- Scan lines -->
    <line x1="-6" y1="-11" x2="6" y2="-11" stroke-dasharray="2 1.5" opacity="0.5"/>
    <line x1="-5" y1="-7" x2="5" y2="-7" stroke-dasharray="2 1.5" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="76" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" fill="#F9F9F2" letter-spacing="-0.02em">AgriScan<tspan fill="#D4FF50">.ai</tspan></text>
</svg>
